{% extends "base.html" %}

{% block title %}Smart Concierge - Vancouver Directory{% endblock %}
{% block meta %}<link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="/studio.css">{% endblock %}

{% block content %}
{# The form styles used to live in an inline <style> block right here, holding 22
   raw hex values. They are in public/studio.css now, alongside the result surface
   they share a component with. Nothing in this file carries a colour. #}

<div class="concierge-wrap">
    <h1 class="detail-title">Smart Concierge</h1>
    <p class="c-body fs-base mb-md">Tell us what you feel like. We will build a walking day from real listings, and you can swap any stop.</p>

    <form id="conciergeForm" class="concierge-card" novalidate>
        <label for="prompt" class="concierge-label">What do you feel like?</label>
        <textarea id="prompt" class="concierge-prompt" placeholder="What do you feel like? e.g. coffee crawl in Gastown, 3 hours, afternoon"></textarea>
        <div id="hoodNote" class="hood-note" aria-live="polite"></div>

        <div class="concierge-grid">
            <div>
                <span class="concierge-label">Categories</span>
                <div id="categoryPills" class="cpill-group">
                    {% for c in categoryOptions %}<button type="button" class="cpill" aria-pressed="false" data-category="{{ c }}">{{ c }}</button>{% endfor %}
                </div>
            </div>
            <div>
                <span class="concierge-label">Time of day</span>
                <div id="timePills" class="cpill-group">
                    <button type="button" class="cpill" aria-pressed="false" data-time="morning">Morning</button>
                    <button type="button" class="cpill" aria-pressed="false" data-time="afternoon">Afternoon</button>
                    <button type="button" class="cpill" aria-pressed="false" data-time="evening">Evening</button>
                    <button type="button" class="cpill" aria-pressed="true" data-time="flexible">Flexible</button>
                </div>

                <span class="concierge-label">Time available</span>
                <div id="durationPills" class="cpill-group">
                    <button type="button" class="cpill" aria-pressed="false" data-duration="2h">2 hours</button>
                    <button type="button" class="cpill" aria-pressed="true" data-duration="4h">4 hours</button>
                    <button type="button" class="cpill" aria-pressed="false" data-duration="8h">8 hours</button>
                </div>

                <details class="hood-details">
                    <summary>Choose a neighbourhood instead</summary>
                    <select id="neighborhood" aria-label="Neighbourhood">
                        <option value="">Anywhere in Vancouver</option>
                        {% for n in neighborhoods %}
                        <option value="{{ n.id }}">{{ n.name }}</option>
                        {% endfor %}
                    </select>
                </details>
            </div>
        </div>

        <button type="submit" id="generateBtn" class="generate-btn">Generate my day</button>
    </form>

    <div id="loading" class="loading-box" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p class="mb-0">Our Concierge is crafting your perfect day...</p>
    </div>

    {% include "_studio_results.html" %}
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/maps-url.js"></script>
<script src="/studio.js"></script>
<script>
// Form behaviour only. The result surface (steps, canvas, export, swaps) is rendered by studio.js,
// which the homepage dock drives too.
function setSingle(groupId, attr, value) {
    document.querySelectorAll('#' + groupId + ' .cpill').forEach((b) => {
        b.setAttribute('aria-pressed', b.dataset[attr] === value ? 'true' : 'false');
    });
}
function activeSingle(groupId, attr) {
    const b = document.querySelector('#' + groupId + ' .cpill[aria-pressed="true"]');
    return b ? b.dataset[attr] : null;
}
document.querySelectorAll('#timePills .cpill').forEach((b) => b.addEventListener('click', () => setSingle('timePills', 'time', b.dataset.time)));
document.querySelectorAll('#durationPills .cpill').forEach((b) => b.addEventListener('click', () => setSingle('durationPills', 'duration', b.dataset.duration)));
document.querySelectorAll('#categoryPills .cpill').forEach((b) => b.addEventListener('click', () => {
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
}));
function activeCategories() {
    return Array.from(document.querySelectorAll('#categoryPills .cpill[aria-pressed="true"]')).map((b) => b.dataset.category);
}

// ---- hint only: the server does the real parsing of neighbourhood names ----
document.getElementById('prompt').addEventListener('input', updateHoodNote);
function updateHoodNote() {
    const text = document.getElementById('prompt').value.toLowerCase();
    const hoods = Array.from(document.querySelectorAll('#neighborhood option')).filter((o) => o.value);
    const hit = hoods.find((o) => text.includes(o.textContent.toLowerCase()));
    document.getElementById('hoodNote').textContent = hit ? `Neighbourhood: ${hit.textContent} (from your prompt)` : '';
}

// ---- auto-submit from a link like /concierge?activity=coffee ----
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const activity = params.get('activity');
    if (activity) {
        document.getElementById('prompt').value = activity;
        updateHoodNote();
        setTimeout(() => document.getElementById('conciergeForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })), 50);
    }
});

// ---- generate ----
document.getElementById('conciergeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    btn.disabled = true;
    loading.classList.add('is-on');
    Studio.hide();

    const payload = {
        activity: document.getElementById('prompt').value,
        categories: activeCategories(),
        duration: activeSingle('durationPills', 'duration') || '4h',
        timeOfDay: activeSingle('timePills', 'time') || 'flexible',
        neighborhoodId: document.getElementById('neighborhood').value
    };

    try {
        const response = await fetch('/api/concierge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const res = await response.json();
        if (res.success) {
            Studio.setData(res.data.steps, res.data.swapOptions);
            Studio.show();
            Studio.render();
        } else {
            alert('Could not build an itinerary: ' + (res.error || 'unknown error'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to generate itinerary.');
    } finally {
        loading.classList.remove('is-on');
        btn.disabled = false;
    }
});
</script>
{% endblock %}
